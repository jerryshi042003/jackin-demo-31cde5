async function open_(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:un(D.s),iterations:20000,hash:'SHA-256'},km,{name:'AES-CBC',length:256},false,['decrypt']);
