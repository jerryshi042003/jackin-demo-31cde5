<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#020807"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>JACK IN — concept demo</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#020807;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  html,body{position:fixed;inset:0;width:100%;overscroll-behavior:none}
  canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block;cursor:pointer}
#action{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent;color:transparent;cursor:pointer}#action:focus-visible{outline:2px solid #eafffb;outline-offset:-6px}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas><button id="action" aria-label="Jack in — demo game"></button>
<script>
(() => {
const AUTO = window.AUTO || /auto=1/.test(location.search);
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W, H, DPR;
function fit(){ DPR = Math.min(window.devicePixelRatio||1, 2); W = innerWidth; H = innerHeight; cv.width = W*DPR; cv.height = H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize', fit); addEventListener('orientationchange', ()=>setTimeout(fit,250)); if(window.visualViewport) visualViewport.addEventListener('resize', fit); fit();

const TEAL='#2ff5d0', MAG='#ff2bd6', AMB='#ffb23a', RED='#ff3355', BLUE='#7aa2ff', WHITE='#eafffb';
const MONO='Sora,sans-serif';
const KANA='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789';
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), easeOut=t=>1-Math.pow(1-clamp(t,0,1),3), easeBack=t=>{t=clamp(t,0,1);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};

const img = n => { const i=new Image(); i.src=n; return i; };
const poster = img('poster.jpg'), takeover = img('takeover.jpg');
// walkout clip behind the start screen (muted so phones allow autoplay)
const walk = document.createElement('video'); walk.src='walkout-hd-r16.mp4'; walk.muted=true; walk.loop=true; walk.playsInline=true; walk.setAttribute('playsinline',''); walk.setAttribute('muted',''); walk.preload='auto';
const playWalk = () => { const p = walk.play(); if(p && p.catch) p.catch(()=>{}); }; playWalk();
let walkIn = 0;

const noise = document.createElement('canvas'); noise.width=96; noise.height=96;
const ng = noise.getContext('2d');
function reNoise(){ const d=ng.createImageData(96,96); for(let i=0;i<d.data.length;i+=4){const v=(Math.random()*150)|0; d.data[i]=v*.75; d.data[i+1]=v; d.data[i+2]=v*.92; d.data[i+3]=255;} ng.putImageData(d,0,0); }

let state='boot', last=performance.now(), time=0, st=0; // st = seconds in current state
let px=0, target=0, score=0, combo=0, best=0, left=0, objs=[], spawn=0, glitch=0, flash=0, speed=1, parts=[], rain=[], btns=[];
let tiltX=0, tiltY=0;
const DUR=20;

// ---- reward state
const TIERS = {
  COMMON:{c:TEAL, label:'COMMON'}, RARE:{c:BLUE, label:'RARE'}, EPIC:{c:MAG, label:'EPIC'}, LEGENDARY:{c:AMB, label:'LEGENDARY'}
};
const POOL = [
  ['10% OFF','a match ticket','COMMON'], ['15% OFF','a match ticket','RARE'],
  ['20% OFF','a match ticket','EPIC'], ['25% OFF','a match ticket','LEGENDARY']
];
let prize=null, code='', phase='', pt=0, shown=0, burst=[], cracks=[], reel=[], reelPos=0, reelFrom=0, reelTo=0;

function initRain(){ rain=[]; const n=Math.ceil(W/18); for(let i=0;i<n;i++) rain.push({x:i*18+6,y:rnd(-H,H),v:rnd(70,260),c:pick(KANA)}); }
initRain(); addEventListener('resize',initRain);

function go(s){ state=s; st=0; }
// ---- full-screen "jack in" warp between the start screen and the game
let stars=[];
function startWarp(){ go('warp'); stars=Array.from({length:240},()=>({a:rnd(0,6.2832),z:rnd(.05,1),c:pick([TEAL,TEAL,WHITE,MAG,BLUE]),k:pick(KANA)}));
  try{ navigator.vibrate && navigator.vibrate([30,40,30,40,30,40,120]); }catch(e){}
  try{ const el=document.documentElement; if(window.parent===window && el.requestFullscreen) el.requestFullscreen().catch(()=>{}); }catch(e){} }
const SHOWCASE=false; // Playable demo; AUTO is only the existing review playback mode.
const N=7; let lvl=0, lives=3, ca=0, ta=0, dir=1, winT=0, deadT=0, flashCol='';
const halfW=()=>.5-lvl*.032;
function newTarget(){ ta = ca + dir*rnd(2.4,4.4); }
function start(){ walk.pause(); go('play'); score=0; best=0; lvl=0; lives=3; ca=-1.57; dir=1; winT=0; deadT=0; parts=[]; flash=0; glitch=0; newTarget(); }
function hitTry(){
  if(winT>0||deadT>0||lvl>=N) return;
  const cx=W/2, cy=H*.52, Rmax=Math.min(W*.43,H*(W>H?.23:.3)), R0=Rmax*.3, r=Rmax-lvl*(Rmax-R0)/(N-1);
  const d=Math.abs(Math.atan2(Math.sin(ca-ta),Math.cos(ca-ta))), tw=halfW(), sx=cx+Math.cos(ca)*r, sy=cy+Math.sin(ca)*r;
  if(d<=tw+.06){ const perfect=d<tw*.35; if(perfect) best++; score+=1000+(perfect?500:0)+Math.round((1-Math.min(1,d/tw))*200);
    for(let i=0;i<46;i++){ const a=rnd(0,6.28), v=rnd(60,420); parts.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.4,.9),c:pick(KANA)}); }
    parts.push({x:sx,y:sy-18,vx:0,vy:-60,l:.8,t:perfect?'PERFECT':'HIT',s:perfect?22:16,col:perfect?'rgba(255,178,58,ALPHA)':'rgba(234,255,251,ALPHA)'});
    flash=.3; flashCol='rgba(47,245,208,'; lvl++; dir*=-1;
    if(lvl>=N){ score+=lives*500; winT=1; flash=.8; flashCol='rgba(234,255,251,'; } else newTarget();
  } else { lives--; flash=.4; flashCol='rgba(255,51,85,'; glitch=.3; parts.push({x:sx,y:sy-18,vx:0,vy:-60,l:.8,t:'MISS',s:18,col:'rgba(255,51,85,ALPHA)'});
    if(lives<=0) deadT=.9; else newTarget(); }
}
function finish(){
  go('result'); phase='score'; pt=0; shown=0; burst=[]; cracks=[];
  // better runs shift the odds toward rarer drops
  const s=score, w = s>8500?[15,35,32,18] : s>6000?[32,38,22,8] : s>3000?[55,32,11,2] : [72,23,4.5,.5];
  let r=Math.random()*100, tier='COMMON'; const names=['COMMON','RARE','EPIC','LEGENDARY'];
  for(let i=0;i<4;i++){ if(r<w[i]){ tier=names[i]; break; } r-=w[i]; }
  prize = pick(POOL.filter(p=>p[2]===tier));
  code='DEMO-'+Array.from({length:4},()=>pick('ACDEFGHJKMNPQRTVWXY34679')).join('')+'-'+Array.from({length:3},()=>pick('0123456789')).join('');
  // reel strip: random prizes, ending on the real one
  reel = Array.from({length:26},()=>pick(POOL)); reel.push(prize); reel.push(pick(POOL)); reelTo = reel.length-2;
}
function crack(){ if(phase!=='cache') return; phase='crack'; pt=0; cracks=Array.from({length:9},()=>({a:rnd(0,6.28),l:rnd(.3,1),j:rnd(-.5,.5)})); }

function goFull(){ if(window.parent!==window)return; try{ const el=document.documentElement, f=el.requestFullscreen||el.webkitRequestFullscreen; if(f && !document.fullscreenElement) { const r=f.call(el); if(r&&r.catch) r.catch(()=>{}); } }catch(e){} }
function tap(x,y){ goFull();
  for(const b of btns){ if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){ b.fn(); return; } }
  if(state==='boot'){ if(st>0.25 && !entering){ entering=true; press=time; } }
  else if(state==='play' && !SHOWCASE) hitTry();
  else if(state==='result' && phase==='cache') crack();
  else if(state==='result' && phase==='card' && pt>1.1) start();
}
function move(x,y){ target = clamp((x/W-0.5)*2.4,-1,1); tiltX=(x/W-.5); tiltY=(y/H-.5); }
cv.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
const action=document.getElementById('action');
action.addEventListener('click',e=>{move(e.clientX||W/2,e.clientY||H/2);tap(e.clientX||W/2,e.clientY||H/2);});
action.addEventListener('pointermove',e=>{ if(e.pressure>0||e.pointerType==='mouse') move(e.clientX,e.clientY); });

const HZ=()=>H*0.36, GROUND=()=>H*0.84;
function proj(x,z){ const t=1-z, k=0.08+0.92*t*t; return {x:W/2+x*W*0.46*k, y:HZ()+(GROUND()-HZ())*t*t, k}; }

function drawRain(dt, y1, alpha){
  g.font='14px '+MONO; g.textAlign='center';
  for(const r of rain){ r.y+=r.v*dt; if(Math.random()<.08) r.c=pick(KANA); if(r.y>y1+20){ r.y=rnd(-120,0); r.v=rnd(70,260);}
    g.fillStyle='rgba(47,245,208,'+(.75*alpha)+')'; g.fillText(r.c,r.x,r.y); g.fillStyle='rgba(47,245,208,'+(.22*alpha)+')'; g.fillText(pick(KANA),r.x,r.y-16); g.fillText(pick(KANA),r.x,r.y-32); }
}
function drawSky(dt){
  if(Math.random()<.5) reNoise();
  g.save(); g.globalAlpha=.55; g.imageSmoothingEnabled=false;
  const p=g.createPattern(noise,'repeat'); g.fillStyle=p; g.scale(3,3); g.fillRect(0,0,W/3,HZ()/3+2); g.restore();
  const gr=g.createLinearGradient(0,0,0,HZ()); gr.addColorStop(0,'rgba(2,8,7,.75)'); gr.addColorStop(1,'rgba(2,8,7,.15)'); g.fillStyle=gr; g.fillRect(0,0,W,HZ()+1);
  drawRain(dt, HZ(), 1);
  for(let i=0;i<26;i++){ const bw=W/26, h=18+((i*73)%47)+((i*31)%23); g.fillStyle='#03110f'; g.fillRect(i*bw,HZ()-h,bw-1,h);
    g.fillStyle=(i%5==0)?MAG:(i%3==0?AMB:TEAL); g.globalAlpha=.8; if(((i*7+((time*2)|0))%4)) g.fillRect(i*bw+3,HZ()-h+5+((i*13)%Math.max(1,h-10)),bw-7,2); g.globalAlpha=1; }
}
function drawGrid(){
  g.fillStyle='#020807'; g.fillRect(0,HZ(),W,H-HZ());
  const gl=g.createLinearGradient(0,HZ(),0,HZ()+90); gl.addColorStop(0,'rgba(47,245,208,.35)'); gl.addColorStop(1,'rgba(47,245,208,0)'); g.fillStyle=gl; g.fillRect(0,HZ(),W,90);
  g.lineWidth=1; g.shadowColor=TEAL; g.shadowBlur=8;
  for(let i=-8;i<=8;i++){ const a=proj(i/4,1), b=proj(i/4,-0.25); g.strokeStyle='rgba(47,245,208,'+(i%4==0?.9:.4)+')'; g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); }
  const off=(time*speed*0.55)%0.1;
  for(let z=1+off; z>-0.25; z-=0.1){ const a=proj(-2,z); g.strokeStyle='rgba(47,245,208,'+(0.15+0.75*(1-z))+')'; g.beginPath(); g.moveTo(0,a.y); g.lineTo(W,a.y); g.stroke(); }
  g.shadowBlur=0;
}
function ball(x,y,r){
  g.save(); g.shadowColor=TEAL; g.shadowBlur=28; g.fillStyle=WHITE; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); g.shadowBlur=0;
  g.strokeStyle='#061a17'; g.lineWidth=1.6; const a=time*5;
  g.beginPath(); for(let i=0;i<5;i++){ const an=a+i*Math.PI*2/5; g.moveTo(x,y); g.lineTo(x+Math.cos(an)*r,y+Math.sin(an)*r);} g.stroke();
  g.fillStyle='#061a17'; g.beginPath(); for(let i=0;i<5;i++){ const an=a+i*Math.PI*2/5; g.lineTo(x+Math.cos(an)*r*.42,y+Math.sin(an)*r*.42);} g.fill();
  g.strokeStyle=TEAL; g.lineWidth=2; g.beginPath(); g.arc(x,y,r+5+Math.sin(time*8)*2,0,7); g.stroke(); g.restore();
}
function glitchPass(n, amp=60){
  for(let i=0;i<n;i++){ const y=(Math.random()*H)|0, h=(4+Math.random()*26)|0, dx=(Math.random()-.5)*amp;
    g.drawImage(cv, 0,y*DPR, cv.width,h*DPR, dx,y, W,h); }
  g.globalCompositeOperation='screen'; g.fillStyle='rgba(255,43,214,.10)'; g.fillRect(rnd(-10,10),0,W,H); g.fillStyle='rgba(47,245,208,.10)'; g.fillRect(rnd(-10,10),0,W,H); g.globalCompositeOperation='source-over';
}
function scan(){ g.fillStyle='rgba(0,0,0,.18)'; for(let y=0;y<H;y+=3) g.fillRect(0,y,W,1);
  const v=g.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.75); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.6)'); g.fillStyle=v; g.fillRect(0,0,W,H);
  // slow bright scan bar
  const sy=((time*120)%(H+200))-100; const sg=g.createLinearGradient(0,sy-40,0,sy+40); sg.addColorStop(0,'rgba(47,245,208,0)'); sg.addColorStop(.5,'rgba(47,245,208,.07)'); sg.addColorStop(1,'rgba(47,245,208,0)'); g.fillStyle=sg; g.fillRect(0,sy-40,W,80); }
function txt(s,x,y,size,col,al='center',glow=0,weight=700){ g.font=weight+' '+size+'px '+MONO; g.textAlign=al; g.fillStyle=col; g.shadowColor=col; g.shadowBlur=glow; g.fillText(s,x,y); g.shadowBlur=0; }
// chromatic-split headline
function rgbTxt(s,x,y,size,col,split){ g.globalCompositeOperation='screen'; txt(s,x-split,y,size,'rgba(255,43,214,.85)'); txt(s,x+split,y,size,'rgba(60,160,255,.85)'); g.globalCompositeOperation='source-over'; txt(s,x,y,size,col,'center',20); }
function scramble(s,p){ let o=''; for(let i=0;i<s.length;i++) o += (i/s.length<p||s[i]===' ')?s[i]:pick(KANA); return o; }
function cover(im,alpha,ox=0,oy=0,zoom=1){ const iw=im.videoWidth||im.naturalWidth, ih=im.videoHeight||im.naturalHeight; if(!iw) return; const r=Math.max(W/iw,H/ih)*zoom, w=iw*r, h=ih*r; g.globalAlpha=alpha; g.drawImage(im,(W-w)/2+ox,(H-h)/2+oy,w,h); g.globalAlpha=1; }
function button(label,x,y,w,h,col,fn,t0=0){
  const a=easeOut((st-t0)/.35); if(a<=0) return; g.save(); g.globalAlpha=a;
  g.fillStyle='rgba(2,14,12,.55)'; g.fillRect(x,y,w,h);
  const pulse=.5+.5*Math.sin(time*5); g.strokeStyle=col; g.lineWidth=2; g.shadowColor=col; g.shadowBlur=10+pulse*16; g.strokeRect(x,y,w,h); g.shadowBlur=0;
  // corner ticks
  g.lineWidth=3; const k=10; for(const [cx,cy,dx,dy] of [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]]){ g.beginPath(); g.moveTo(cx+dx*k,cy); g.lineTo(cx,cy); g.lineTo(cx,cy+dy*k); g.stroke(); }
  // sheen sweep
  g.save(); g.beginPath(); g.rect(x,y,w,h); g.clip(); const sx=x-80+((time*.7)%1)*(w+160); const sh=g.createLinearGradient(sx-40,0,sx+40,0); sh.addColorStop(0,'rgba(255,255,255,0)'); sh.addColorStop(.5,'rgba(255,255,255,.28)'); sh.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=sh; g.fillRect(x,y,w,h); g.restore();
  txt(label,x+w/2,y+h/2+7,Math.min(22,w*.075),col,'center',12); g.restore();
  btns.push({x,y,w,h,fn});
}
function rays(cx,cy,col,alpha,R){ g.save(); g.translate(cx,cy); g.rotate(time*.5); g.globalCompositeOperation='screen';
  for(let i=0;i<14;i++){ g.rotate(Math.PI*2/14); const gr=g.createLinearGradient(0,0,R,0); gr.addColorStop(0,col); gr.addColorStop(1,'rgba(0,0,0,0)'); g.globalAlpha=alpha*(i%2?.5:1); g.fillStyle=gr; g.beginPath(); g.moveTo(0,0); g.lineTo(R,-R*.09); g.lineTo(R,R*.09); g.closePath(); g.fill(); }
  g.restore(); g.globalAlpha=1; }
// wireframe data cache (rotating cube inside a cube)
function cube(cx,cy,s,ax,ay,col,inner){
  const V=[]; for(const x of [-1,1]) for(const y of [-1,1]) for(const z of [-1,1]) V.push([x,y,z]);
  const P=V.map(([x,y,z])=>{ let X=x*Math.cos(ay)+z*Math.sin(ay), Z=-x*Math.sin(ay)+z*Math.cos(ay); let Y=y*Math.cos(ax)-Z*Math.sin(ax); Z=y*Math.sin(ax)+Z*Math.cos(ax); const k=3.2/(3.2+Z); return [cx+X*s*k, cy+Y*s*k]; });
  const E=[[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];
  g.strokeStyle=col; g.lineWidth=inner?1:2.5; g.shadowColor=col; g.shadowBlur=inner?6:18; g.beginPath(); for(const [a,b] of E){ g.moveTo(P[a][0],P[a][1]); g.lineTo(P[b][0],P[b][1]); } g.stroke(); g.shadowBlur=0;
  if(!inner){ g.fillStyle=col; for(const p of P){ g.beginPath(); g.arc(p[0],p[1],3,0,7); g.fill(); } }
}

const ARMS=Array.from({length:190},(_,i)=>({f:Math.pow((i+1)/190,.8),arm:i%2,j:rnd(-.22,.22),jr:rnd(-.06,.06),gold:Math.random()<.22,tw:rnd(0,6.28)}));
let press=-9, entering=false;
function galaxy(cx,cy,R){
  const k=clamp((time-press)/.6,0,1), suck = k<1 ? 1-easeOut(k)*.85 : 1, pulse=.5+.5*Math.sin(time*3.2);
  for(let i=0;i<2;i++){ const q=((time*.55+i*.5)%1); g.strokeStyle='rgba(47,245,208,'+(1-q)*.45+')'; g.lineWidth=1.5; g.beginPath(); g.arc(cx,cy,R*(1.05+q*.9),0,6.2832); g.stroke(); }
  g.strokeStyle='rgba(47,245,208,.5)'; g.lineWidth=1; g.setLineDash([2,7]); g.lineDashOffset=-time*26; g.beginPath(); g.arc(cx,cy,R*1.16,0,6.2832); g.stroke(); g.setLineDash([]);
  g.strokeStyle=TEAL; g.lineWidth=2.5; g.lineCap='round'; g.shadowColor=TEAL; g.shadowBlur=12;
  for(let i=0;i<3;i++){ const a0=-time*1.3+i*2.0944; g.beginPath(); g.arc(cx,cy,R*1.04,a0,a0+.7); g.stroke(); } g.shadowBlur=0;
  for(const d of ARMS){ const r=(R*(.14+.8*d.f)+d.jr*R)*suck, an=d.f*5.2+d.arm*Math.PI+d.j+time*(1.5-d.f*1.05)+(1-suck)*6, x=cx+Math.cos(an)*r, y=cy+Math.sin(an)*r*.92, tw=.6+.4*Math.sin(time*4+d.tw);
    g.fillStyle=d.gold?'rgba(255,196,84,'+(.95-d.f*.4)*tw+')':'rgba(120,255,228,'+(.95-d.f*.45)*tw+')'; g.beginPath(); g.arc(x,y,.9+(1-d.f)*1.9,0,6.2832); g.fill(); }
  const cr=R*(.3+.05*pulse+(1-suck)*.5), cg=g.createRadialGradient(cx,cy,0,cx,cy,cr); cg.addColorStop(0,'#fff'); cg.addColorStop(.35,'rgba(160,255,238,.85)'); cg.addColorStop(1,'rgba(47,245,208,0)'); g.fillStyle=cg; g.beginPath(); g.arc(cx,cy,cr,0,6.2832); g.fill();
  g.font='700 19px '+MONO; g.textAlign='center'; g.fillStyle=WHITE; g.shadowColor=TEAL; g.shadowBlur=12; let lx=cx-51; for(const ch of 'JACK IN'){ g.fillText(ch,lx,cy+R*1.16+40); lx+=17; } g.shadowBlur=0;
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; time+=dt; st+=dt; btns=[];
  g.fillStyle='#020807'; g.fillRect(0,0,W,H);

  if(state==='boot'){
    // background: walkout video with slight parallax + slow zoom, fades in over the poster
    const ok = walk.readyState>=2 && !walk.paused; if(ok) walkIn=Math.min(1,walkIn+dt*2); else playWalk();
    const zm=1.08+.04*Math.sin(time*.4); cover(poster,1-walkIn,-tiltX*14,-tiltY*10,zm); if(ok) cover(walk,walkIn,-tiltX*14,-tiltY*10,zm);
    const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'rgba(2,8,7,.3)'); gr.addColorStop(.2,'rgba(2,8,7,0)'); gr.addColorStop(.5,'rgba(2,8,7,0)'); gr.addColorStop(.72,'rgba(2,8,7,.55)'); gr.addColorStop(1,'rgba(2,8,7,.92)'); g.fillStyle=gr; g.fillRect(0,0,W,H);
    txt('LA GALAXY × NEUROMANCER',W/2,Math.max(46,H*.09),Math.min(15,W*.037),WHITE,'center',0,500);
    const R=Math.min(86,W*.22,H*.145), gy=H*.67;
    galaxy(W/2,gy,R);
    txt('Demo game',W/2,Math.min(H-25,gy+R*1.16+72),14,WHITE,'center',0,400);
    if(entering && time-press>.55) startWarp();
    if(AUTO && st>3.2 && !entering){entering=true;press=time;}

  }

  if(state==='warp'){
    const p=clamp(st/2.6,0,1), v=.25+p*p*3.4, M=Math.max(W,H), sh=p*p*12, cx=W/2+rnd(-sh,sh), cy=H*.47+rnd(-sh,sh);
    // fly through the tunnel mouth: the walkout frame zooms past the camera
    cover(walk.readyState>=2?walk:poster,.75*(1-p),0,H*.06*p,1.06+p*p*4.5);
    g.fillStyle='rgba(2,8,7,'+(.25+p*.5)+')'; g.fillRect(0,0,W,H);
    // rotating hex gates rushing outward
    for(let k=0;k<9;k++){ const q=((k/9+time*(.45+p*1.6))%1), r=q*q*M*.95; g.save(); g.translate(cx,cy); g.rotate(time*.7+k*.5); g.globalAlpha=q*.9; g.strokeStyle=k%3?TEAL:MAG; g.lineWidth=1+q*5; g.beginPath(); for(let i=0;i<=6;i++){ const a=i*Math.PI/3; g.lineTo(Math.cos(a)*r,Math.sin(a)*r); } g.stroke(); g.restore(); }
    g.globalAlpha=1;
    // data streaks from the centre
    g.lineCap='round'; g.textAlign='center';
    for(let i=0;i<stars.length;i++){ const s=stars[i], z0=s.z; s.z-=v*dt*(.6+((i%7)/7)); if(s.z<=.025){ s.z=1; s.a=rnd(0,6.2832); continue; }
      const r0=(1/z0-1)*M*.075, r1=(1/s.z-1)*M*.075, ca2=Math.cos(s.a), sa2=Math.sin(s.a), al=Math.min(1,(1-s.z)*1.6);
      g.strokeStyle=s.c; g.globalAlpha=al; g.lineWidth=1+(1-s.z)*3.5; g.beginPath(); g.moveTo(cx+ca2*r0,cy+sa2*r0); g.lineTo(cx+ca2*r1,cy+sa2*r1); g.stroke();
      if(i%5===0){ g.font=(10+(1-s.z)*30|0)+'px '+MONO; g.fillStyle=s.c; g.fillText(s.k,cx+ca2*r1,cy+sa2*r1); } }
    g.globalAlpha=1; g.lineCap='butt';
    // core light that swallows the screen at the end
    const cr=30+Math.pow(p,3)*M*1.2, cg=g.createRadialGradient(cx,cy,0,cx,cy,cr); cg.addColorStop(0,'rgba(234,255,251,1)'); cg.addColorStop(.35,'rgba(47,245,208,.75)'); cg.addColorStop(1,'rgba(47,245,208,0)'); g.fillStyle=cg; g.fillRect(0,0,W,H);
    if(p<.8){ const size=Math.min(40,W*.1)*(1+p*.6); rgbTxt(scramble('JACKING IN',p*1.6),W/2,H*.47+size*.35,size,WHITE,2+p*12); txt(Math.round(p*125)+'%',W/2,H*.47+size*.35+34,16,AMB); }

    if(p>=1){ start(); flash=1; flashCol='rgba(234,255,251,'; }
  }

  if(state==='play'){
    // BREAK THE ICE: one thumb. A spark orbits the outer ring; tap anywhere when it crosses the gold gap.
    const cx=W/2, cy=H*.52, Rmax=Math.min(W*.43,H*(W>H?.23:.3)), R0=Rmax*.3, rad=i=>Rmax-i*(Rmax-R0)/(N-1);
    cover(takeover,.22); g.fillStyle='rgba(2,8,7,.72)'; g.fillRect(0,0,W,H); drawRain(dt,H,.2);
    if(winT>0){ winT-=dt; if(winT<=0){ if(SHOWCASE){ const k=st; start(); st=k; } else finish(); } } else if(deadT>0){ deadT-=dt; if(deadT<=0) finish(); }
    else { ca += dir*(2.3+lvl*.36)*dt; if(AUTO||SHOWCASE){ const d=Math.atan2(Math.sin(ca-ta),Math.cos(ca-ta)); if(Math.abs(d)<.07) hitTry(); } }
    rays(cx,cy,TEAL,.05+lvl*.02,Rmax*1.6);
    for(let i=N-1;i>=lvl;i--){ const r=rad(i), act=i===lvl;
      g.save(); g.translate(cx,cy); g.rotate((i%2?1:-1)*time*.25);
      g.strokeStyle=act?'rgba(47,245,208,.9)':'rgba(47,245,208,.22)'; g.lineWidth=act?3:1.5; g.setLineDash(act?[14,6]:[4,10]); g.shadowColor=TEAL; g.shadowBlur=act?14:0; g.beginPath(); g.arc(0,0,r,0,6.2832); g.stroke(); g.restore(); g.setLineDash([]); g.shadowBlur=0; }
    if(lvl<N){ const r=rad(lvl), tw=halfW();
      // the gold gap
      g.strokeStyle=AMB; g.lineWidth=13; g.lineCap='round'; g.shadowColor=AMB; g.shadowBlur=22+8*Math.sin(time*9); g.beginPath(); g.arc(cx,cy,r,ta-tw,ta+tw); g.stroke();
      g.strokeStyle=WHITE; g.lineWidth=3; g.shadowBlur=0; g.beginPath(); g.arc(cx,cy,r,ta-tw*.35,ta+tw*.35); g.stroke(); g.lineCap='butt';
      // the spark, with a comet trail
      for(let k=10;k>=0;k--){ const an=ca-dir*k*.045, q=1-k/11; g.fillStyle='rgba(234,255,251,'+q*q+')'; g.shadowColor=TEAL; g.shadowBlur=k?0:26; g.beginPath(); g.arc(cx+Math.cos(an)*r,cy+Math.sin(an)*r,3+q*6,0,7); g.fill(); } g.shadowBlur=0; }
    // core
    const cs=R0*.42*(1+(winT>0?(1-winT)*1.6:0)); cube(cx,cy,cs,time*.8,time*1.1,winT>0?AMB:TEAL,false); cube(cx,cy,cs*.5,-time,-time*1.4,WHITE,true);
    g.font='14px '+MONO; g.textAlign='center';
    for(const q of parts){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=.97; q.vy*=.97; q.l-=dt; const al=clamp(q.l/.7,0,1); if(q.t){ txt(q.t,q.x,q.y,q.s,q.col.replace('ALPHA',al),'center',12); } else { g.fillStyle='rgba(47,245,208,'+al+')'; g.fillText(q.c,q.x,q.y); } } parts=parts.filter(q=>q.l>0);
    // HUD
    const top=Math.max(90,H*.105);
    txt('DEMO GAME',16,top,12,WHITE,'left');
    txt(String(score).padStart(5,'0'),16,top+34,30,TEAL,'left',12);
    txt('LAYER '+Math.min(lvl+1,N)+'/'+N,W-16,top+12,13,WHITE,'right');
    for(let i=0;i<3;i++){ g.fillStyle=i<lives?MAG:'rgba(255,43,214,.18)'; g.shadowColor=MAG; g.shadowBlur=i<lives?10:0; const x=W-22-i*22, y=top+30; g.beginPath(); g.moveTo(x,y-8); g.lineTo(x+7,y); g.lineTo(x,y+8); g.lineTo(x-7,y); g.fill(); } g.shadowBlur=0;
    if(SHOWCASE){
      // label over the example, and the one button people need
      const pw=Math.min(330,W*.88), py=top+62; g.fillStyle='rgba(2,14,12,.82)'; g.fillRect(cx-pw/2,py,pw,62); g.strokeStyle=AMB; g.lineWidth=1.5; g.setLineDash([6,5]); g.strokeRect(cx-pw/2,py,pw,62); g.setLineDash([]);
      txt('THE GAME GOES HERE',cx,py+26,17,AMB,'center',8); txt('example playing itself · 1 of 20 mini games',cx,py+47,11,'rgba(216,255,247,.8)',undefined,0,400);
      const bw=Math.min(300,W*.8); button('OPEN YOUR REWARD ▸',cx-bw/2,Math.min(H-96,cy+Rmax+34),bw,58,TEAL,()=>{ score=7200; best=4; lvl=N; finish(); },.3);
      if(AUTO && st>4) { score=7200; best=4; lvl=N; finish(); }
    }
    else if(winT>0) rgbTxt('ICE BROKEN',cx,cy+Rmax+58,30,AMB,3); else if(deadT>0) rgbTxt('FLATLINED',cx,cy+Rmax+58,30,RED,4);
    else { g.globalAlpha=.6+.4*Math.sin(time*5); txt('TAP ANYWHERE',cx,cy+Rmax+52,20,WHITE,'center',10); g.globalAlpha=1; txt('when the spark hits the gold gap',cx,cy+Rmax+76,13,'rgba(216,255,247,.8)',undefined,0,400); }
    if(flash>0){ g.fillStyle=(flashCol||'rgba(255,51,85,')+flash+')'; g.fillRect(0,0,W,H); flash-=dt*1.6; }
    if(glitch>0) glitch-=dt;
  }

  if(state==='result'){
    pt+=dt; const T=TIERS[prize[2]], cx=W/2, cy=H*.46;
    cover(takeover,.45); g.fillStyle='rgba(2,8,7,.7)'; g.fillRect(0,0,W,H); drawRain(dt,H,.18);
    // score header counts up
    shown += (score-shown)*Math.min(1,dt*6); txt(SHOWCASE?'EXAMPLE SCORE':(lvl>=N?'ICE BROKEN':'FLATLINED AT LAYER '+(lvl+1)),cx,H*.12,13,(SHOWCASE||lvl>=N)?AMB:RED);
    txt(String(Math.round(shown)).padStart(5,'0'),cx,H*.185,40,TEAL,'center',14);
    txt(best+' perfect hits · '+lives+' lives left',cx,H*.215,11,'rgba(216,255,247,.7)',undefined,0,400);
    if(phase==='score' && pt>.7){ phase='cache'; pt=0; }

    if(phase==='cache' || phase==='crack'){
      const k = phase==='crack' ? pt/1.0 : 0, s=Math.min(W*.2,H*.1,86)*easeBack(phase==='cache'?pt/.5:1)*(1+k*.25);
      const sh = k*k*14, ox=rnd(-sh,sh), oy=rnd(-sh,sh), spin=time*(.9+k*9);
      const col = k>.55 ? T.c : WHITE;   // rarity colour leaks out as it cracks
      rays(cx,cy,T.c,.05+k*.35,H*.55);
      cube(cx+ox,cy+oy,s,spin*.7,spin,col,false); cube(cx+ox,cy+oy,s*.5,-spin,-spin*1.3,T.c,true);
      txt('?',cx+ox,cy+oy+14,40,col,'center',16);
      if(phase==='crack'){ g.strokeStyle=WHITE; g.lineWidth=2; g.shadowColor=T.c; g.shadowBlur=14; for(const c of cracks){ const L=s*1.7*c.l*Math.min(1,k*1.6); g.beginPath(); g.moveTo(cx+ox,cy+oy); g.lineTo(cx+ox+Math.cos(c.a+c.j)*L*.5,cy+oy+Math.sin(c.a+c.j)*L*.5); g.lineTo(cx+ox+Math.cos(c.a)*L,cy+oy+Math.sin(c.a)*L); g.stroke(); } g.shadowBlur=0;
        if(pt>=1.0){ phase='reel'; pt=0; flash=1; reelFrom=0; for(let i=0;i<90;i++){ const a=rnd(0,6.28), v=rnd(120,720); burst.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.6,1.4),c:pick(KANA),k:Math.random()<.4}); } } }
      else { const a=.55+.45*Math.sin(time*5); g.globalAlpha=a; txt('TAP TO CRACK THE CACHE',cx,cy+s*2.1+26,15,WHITE,'center',10); g.globalAlpha=1; txt('prize cache secured',cx,cy+s*2.1+48,11,'rgba(216,255,247,.6)',undefined,0,400);
        if(AUTO && pt>1.6) crack(); }
    }
    if(phase==='reel' || phase==='card'){
      rays(cx,cy,T.c,phase==='reel'?.4:.22,H*.7);
      const rowH=54, cw=Math.min(340,W*.88);
      if(phase==='reel'){
        const p=easeOut(pt/2.2); reelPos = reelTo*p; const win=rowH*3;
        g.save(); g.beginPath(); g.rect(cx-cw/2,cy-win/2,cw,win); g.clip(); g.fillStyle='rgba(2,14,12,.9)'; g.fillRect(cx-cw/2,cy-win/2,cw,win);
        for(let i=Math.max(0,(reelPos|0)-2); i<Math.min(reel.length,(reelPos|0)+3); i++){ const y=cy+(i-reelPos)*rowH+10, d=Math.abs(i-reelPos), tc=TIERS[reel[i][2]].c; g.globalAlpha=clamp(1-d*.55,0.12,1); txt(reel[i][0],cx,y,d<.5?30:22,d<.5?WHITE:tc,'center',d<.5?16:0); }
        g.restore(); g.globalAlpha=1; g.strokeStyle=T.c; g.lineWidth=2; g.shadowColor=T.c; g.shadowBlur=16; g.strokeRect(cx-cw/2,cy-win/2,cw,win); g.shadowBlur=0;
        g.fillStyle=T.c; g.beginPath(); g.moveTo(cx-cw/2-2,cy-8); g.lineTo(cx-cw/2+12,cy); g.lineTo(cx-cw/2-2,cy+8); g.fill(); g.beginPath(); g.moveTo(cx+cw/2+2,cy-8); g.lineTo(cx+cw/2-12,cy); g.lineTo(cx+cw/2+2,cy+8); g.fill();
        txt('DECRYPTING…',cx,cy-win/2-14,12,T.c);
        if(pt>=2.35){ phase='card'; pt=0; flash=.7; glitch=.25; for(let i=0;i<50;i++){ const a=rnd(0,6.28), v=rnd(100,560); burst.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.5,1.2),c:pick(KANA),k:true}); } }
      } else {
        const ch=250, sc=easeBack(pt/.45), x=cx-cw/2, y=cy-ch/2;
        g.save(); g.translate(cx,cy); g.scale(sc,sc); g.rotate(tiltX*.05); g.translate(-cx,-cy);
        g.fillStyle='rgba(2,14,12,.94)'; g.fillRect(x,y,cw,ch); g.strokeStyle=T.c; g.lineWidth=2.5; g.shadowColor=T.c; g.shadowBlur=26; g.strokeRect(x,y,cw,ch); g.shadowBlur=0;
        // holographic sheen
        g.save(); g.beginPath(); g.rect(x,y,cw,ch); g.clip(); g.globalCompositeOperation='screen'; const hx=x-cw+(((time*.45)%1)*cw*3)+tiltX*120; const hg=g.createLinearGradient(hx,y,hx+cw*.8,y+ch); hg.addColorStop(0,'rgba(255,43,214,0)'); hg.addColorStop(.35,'rgba(255,43,214,.16)'); hg.addColorStop(.5,'rgba(255,255,255,.22)'); hg.addColorStop(.65,'rgba(47,245,208,.16)'); hg.addColorStop(1,'rgba(47,245,208,0)'); g.fillStyle=hg; g.fillRect(x,y,cw,ch); g.restore();
        // rarity tag
        const tw=T.label.length*10+26; g.fillStyle=T.c; g.fillRect(cx-tw/2,y-13,tw,26); txt(T.label,cx,y+5,13,'#020807');
        txt('WINTERMUTE GRANTS YOU',cx,y+46,11,'rgba(216,255,247,.75)',undefined,0,400);
        txt(prize[0],cx,y+110,Math.min(46,cw/(prize[0].length*.62)),WHITE,'center',24);
        txt(prize[1],cx,y+140,14,T.c);
        g.setLineDash([4,5]); g.strokeStyle='rgba(216,255,247,.35)'; g.lineWidth=1; g.beginPath(); g.moveTo(x+16,y+166); g.lineTo(x+cw-16,y+166); g.stroke(); g.setLineDash([]);
        txt(scramble(code,pt/1.0),cx,y+204,22,AMB,'center',8); txt('Demo code · not redeemable',cx,y+228,12,'rgba(216,255,247,.6)',undefined,0,400);
        g.restore();
        if(pt>1.1){ const sv=st; st=pt-1.1+1; const bw=Math.min(260,cw*.7), by=cy+ch/2+26; button('PLAY AGAIN',cx-bw/2,by,bw,50,TEAL,start,1); st=sv;
          if(H>500)txt('Demo game · sample discount',cx,by+82,12,'rgba(216,255,247,.8)',undefined,0,400); }
        if(AUTO && pt>6) start();
      }
    }
    g.font='14px '+MONO; g.textAlign='center';
    for(const q of burst){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=.985; q.vy=q.vy*.985+260*dt; q.l-=dt; const a=clamp(q.l,0,1); if(q.k){ g.fillStyle=T.c; g.globalAlpha=a; g.fillRect(q.x,q.y,4,4); g.globalAlpha=1; } else { g.fillStyle='rgba(234,255,251,'+a+')'; g.fillText(q.c,q.x,q.y); } } burst=burst.filter(q=>q.l>0);
    if(flash>0){ g.fillStyle='rgba(234,255,251,'+flash+')'; g.fillRect(0,0,W,H); flash-=dt*2.4; }
    if(glitch>0) glitch-=dt;
  }

  const label=state==='boot'?'Jack in — demo game':state==='warp'?'Entering demo game':state==='play'?`Tap when the spark hits gold. Layer ${Math.min(lvl+1,N)} of ${N}. ${lives} lives. Score ${score}.`:phase==='cache'?'Tap to crack the discount box':phase==='card'?`${prize[0]}. Demo code ${code}, not redeemable. Play again.`:'Revealing demo discount';
  if(action.getAttribute('aria-label')!==label)action.setAttribute('aria-label',label);
  action.dataset.stage=state==='result'?phase:state;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
