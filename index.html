async function open_(pw){

  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:un(D.s),iterations:150000,hash:'SHA-256'},km,{name:'AES-CBC',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:un(D.i)},key,un(D.c));
  const html=new TextDecoder().decode(pt); if(html.indexOf('<!doctype html>')!==0) throw 0;

  document.open(); document.write(html); document.close();
}
