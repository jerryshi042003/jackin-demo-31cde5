async function open_(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:un(D.s),iterations:20000,hash:'SHA-256'},km,{name:'AES-CBC',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:un(D.i)},key,un(D.c));
  const html=new TextDecoder().decode(pt); if(html.indexOf('<!doctype html>')!==0) throw 0;
  try{ localStorage.setItem('wm_pw',pw); }catch(e){}
  document.open(); document.write(html); document.close();
}

f.addEventListener('submit',async e=>{ e.preventDefault(); m.textContent='';
  try{ await open_(p.value.trim().toLowerCase()); }catch(err){ m.textContent='Wrong password'; f.classList.remove('bad'); void f.offsetWidth; f.classList.add('bad'); p.select(); } });
// returning visitors never see the form: stay dark, unlock, and only show the form if that fails
const show=()=>{ f.style.visibility='visible'; p.focus(); };
let saved=null; try{ saved=localStorage.getItem('wm_pw'); }catch(e){}
if(saved) open_(saved).catch(show); else show();
